name: UMML ASIC Synthesis Check

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  yosys-synthesis:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Yosys (Open Source ASIC Synthesis Tool)
      run: sudo apt-get update && sudo apt-get install -y yosys

    - name: Synthesize Stage 5 Design
      run: |
        cd stage5_spatial
        # Read the SystemVerilog, synthesize the swarm_node to generic gates, and print stats
        yosys -p "read_verilog -sv stage5_design.sv; synth -top swarm_node; stat"