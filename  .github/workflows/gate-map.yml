name: Generate Silicon Gate Map

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-map:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Install Yosys
      run: sudo apt-get update && sudo apt-get install -y yosys

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install NetlistSVG
      run: npm install -g netlistsvg

    - name: Synthesize and Generate Map
      run: |
        cd stage5_spatial
        yosys -p "read_verilog -sv stage5_design.sv; synth -top swarm_node; write_json swarm.json"
        netlistsvg swarm.json -o ../swarm_gate_map.svg
        ls -la ../swarm_gate_map.svg

    - name: Upload Gate Map as Artifact
      uses: actions/upload-artifact@v4
      with:
        name: swarm-gate-map
        path: swarm_gate_map.svg

    - name: Commit Gate Map to Repo
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "docs: auto-generate swarm_node silicon gate map"
        file_pattern: swarm_gate_map.svg